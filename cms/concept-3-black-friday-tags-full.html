.hn-vcn {
  /* GEL tokens (hn). The site has no GEL custom properties yet, so the block carries the ones it uses. */
  --spacing-2xs: 8px; --spacing-xs: 12px; --spacing-sm: 16px; --spacing-md: 20px; --spacing-lg: 24px; --spacing-xl: 32px;

  --badge-availability-background-customer-direct: #f2fafd; --badge-availability-label-customer-direct: #005b9c;
  --spacing-3xs: 4px; --font-size-2xs: 10px; --font-weight-bold: 700;
  --button-tertiary-background-default: #f3f4f5; --button-tertiary-label-default: #373737;
  --button-state-hover: #00000033; --focus-ring-default: #00121f;
  --font-family-foundation: "Albert Sans", Lato, sans-serif; --font-weight-extrabold: 800; --font-size-3xl: 24px; --line-height-3xl: 36px;
  --font-family-utility: Lato, Arial, sans-serif; --font-size-xs: 12px; --line-height-xs: 14px; --font-size-sm: 14px; --line-height-md: 18px;
  /* Not a GEL token yet: Figma's drop shadow on Button / Small (x 0, y 4, blur 4, 25% opacity) */
  --hn-vcn-arrow-shadow: 0 4px 4px rgba(0, 0, 0, 0.25);
  /* Room for the focus ring, which sits 2px outside the tile: 2px gap + 2px ring */
  --hn-vcn-focus-room: calc(var(--border-md) * 2);
  container-type: inline-size;
  display: block;
  /* 20 + the 4px focus room inside the list = the 24px (spacing-lg) above and below the tiles */
  padding-block: var(--spacing-md);
  background: var(--color-background-default);
  font-family: var(--font-family-utility);
}
/* The block sets its own box model, so it renders the same whatever the page's CSS does */
.hn-vcn, .hn-vcn *, .hn-vcn *::before, .hn-vcn *::after { box-sizing: border-box; }
/* Component sizes from Figma: phone tiles 88, Square/Icons 112 (72px icon), Square/Images 134 (110px image) */
.hn-vcn__frame { --hn-vcn-gutter: var(--spacing-sm); --hn-vcn-tile: 88px; --hn-vcn-arrow-top: 45px; }
.hn-vcn .hn-vcn__viewport { position: relative; }
.hn-vcn .hn-vcn__list {
  display: flex; gap: var(--spacing-xs);
  margin: 0; padding: var(--hn-vcn-focus-room) 0; list-style: none;
  overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.hn-vcn .hn-vcn__list::-webkit-scrollbar { display: none; }
.hn-vcn .hn-vcn__item { flex: 0 0 var(--hn-vcn-tile); margin: 0; padding: 0; scroll-snap-align: start; }
.hn-vcn .hn-vcn__tile {
  display: flex; flex-direction: column; align-items: center; gap: var(--spacing-xs);
  color: var(--color-text-primary); text-decoration: none; -webkit-user-drag: none;
}
.hn-vcn .hn-vcn__media {
  display: flex; align-items: center; justify-content: center;
  width: 100%; aspect-ratio: 1 / 1; overflow: hidden;
  background: var(--color-background-tint); border-radius: var(--radius-xl);
}
/* Icons sit in a 60px box 26px inside a 112px tile (72 in a 134 circle), as in Visual Category Navigation 0.1: 23.2% scales it on phones */
.hn-vcn .hn-vcn__media--icon { padding: 23.2%; }
.hn-vcn .hn-vcn__media--icon svg { display: block; width: 100%; height: 100%; }
.hn-vcn .hn-vcn__media--photo { padding: var(--spacing-2xs); }
.hn-vcn .hn-vcn__media--art { background: none; }
/* Two-product tiles: each photo placed by % of the tile, from the build */
.hn-vcn .hn-vcn__media--multi { position: relative; }
.hn-vcn .hn-vcn__media--multi .hn-vcn__photo { position: absolute; }
/* The Sale, Bonus & Clearance tag sits on the tile's tint, as in Figma (the Black Friday art brings its own ground) */
.hn-vcn .hn-vcn__item--promo .hn-vcn__media--art { background: var(--color-background-tint); }
/* Concept 2, Visual Category Navigation 0.1: every tile is the same component. The 134px tile (tint, 4px corners) holds a
   100 x 74 image container, centred, its bottom 29.5px above the tile's. Set in % so it scales with the tile (88px on phones).
   Each category supplies one image for the container (a transparent 200 x 148 PNG, the container at 2x); an image of any

<script>
(() => {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  document.querySelectorAll(".hn-vcn").forEach((nav) => {
    if (nav.dataset.vcnReady) return;
    nav.dataset.vcnReady = "1";
    const list = nav.querySelector(".hn-vcn__list");
    const prev = nav.querySelector(".hn-vcn__arrow--prev");
    const next = nav.querySelector(".hn-vcn__arrow--next");
    const update = () => {
      const max = list.scrollWidth - list.clientWidth;
      const atStart = list.scrollLeft <= 1, atEnd = list.scrollLeft >= max - 1;
      if (atStart && document.activeElement === prev) next.focus();
      if (atEnd && document.activeElement === next) prev.focus();
      prev.hidden = atStart;
      next.hidden = atEnd;
    };
    // An arrow moves the rail by every whole tile in view but one, so one tile stays for context.
    let startX = 0, startLeft = 0, down = false, dragged = false;
    const page = (dir) => {
      const item = list.querySelector(".hn-vcn__item");
      const step = item.offsetWidth + (parseFloat(getComputedStyle(list).columnGap) || 0);
      const tiles = Math.max(1, Math.floor(list.clientWidth / step) - 1);
      list.scrollBy({ left: dir * tiles * step, behavior: reduce.matches ? "auto" : "smooth" });
    };
    // Fullstory: named events for tiles, arrows and the first scroll, sent only when Fullstory is on the page
    // (Browser API v2, FS("trackEvent"), or v1's FS.event). Fullstory also records the clicks themselves; the
    // data-fs-element, data-category and data-position attributes give its element definitions stable selectors.
    const track = (name, props) => {
      const fs = window.FS;
      if (typeof fs !== "function") return;
      const properties = Object.assign({ concept: nav.dataset.concept, width: nav.dataset.width }, props);
      try { if (typeof fs.event === "function") fs.event(name, properties); else fs("trackEvent", { name, properties }); } catch (e) {}
    };
    prev.addEventListener("click", () => { track("Category Rail Arrow Clicked", { direction: "previous" }); page(-1); });
    next.addEventListener("click", () => { track("Category Rail Arrow Clicked", { direction: "next" }); page(1); });
    list.addEventListener("click", (e) => {
      const a = e.target.closest(".hn-vcn__tile");
      if (a) track("Category Rail Tile Clicked", { category: a.dataset.category, position: +a.dataset.position, href: a.getAttribute("href") });
    });
    let scrolled = false;
    list.addEventListener("scroll", update, { passive: true });
    list.addEventListener("scroll", () => {
      if (scrolled) return;
      scrolled = true; track("Category Rail Scrolled", { method: down ? "drag" : "scroll" });
    }, { passive: true });
    // A tile that takes keyboard focus under an arrow, or past the rail's edge, is moved into view a whole tile at a time so the snap holds,
    // and the focus ring is never covered (WCAG 2.4.11, and 2.4.12 where the rail allows).
    list.addEventListener("focusin", (e) => {
      const item = e.target.closest(".hn-vcn__item");
      if (!item) return;
      requestAnimationFrame(() => {
        const step = item.offsetWidth + (parseFloat(getComputedStyle(list).columnGap) || 0);
        for (let i = 0; i < 4; i++) {
          const r = item.getBoundingClientRect(), v = list.getBoundingClientRect();
          const hit = [prev, next].find((b) => { if (b.hidden || !b.offsetWidth) return false; const q = b.getBoundingClientRect(); return r.left < q.right && r.right > q.left; });
          const dir = hit ? (hit === prev ? -1 : 1) : r.left < v.left - 1 ? -1 : r.right > v.right + 1 ? 1 : 0;

          update();

    });

    else window.addEventListener("resize", update);
    // Drag to scroll with a mouse; touch and trackpads scroll natively. A drag never opens a tile.
    startX = 0; startLeft = 0; down = false; dragged = false;
    list.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse" || e.button !== 0) return;
      down = true; dragged = false; startX = e.clientX; startLeft = list.scrollLeft;
    });
    list.addEventListener("pointermove", (e) => {
      if (!down) return;

      if (dragged) list.scrollLeft = startLeft - dx;
    });
    const release = () => { down = false; nav.classList.remove("hn-vcn--dragging"); };
    list.addEventListener("pointerup", release);
    list.addEventListener("pointercancel", release);
    list.addEventListener("click", (e) => { if (dragged) { e.preventDefault(); e.stopPropagation(); dragged = false; } }, true);
    update();
  });
})();
</script>
